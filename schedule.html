<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مواعيد الفروع | بوابة أدوات Odoo</title>
  <script>(function(){try{var t=localStorage.getItem('theme');if(t!=='dark'&&t!=='light')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t}catch(e){}})()</script>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js">
  <link rel="modulepreload" href="js/firebase.js">
  <link rel="modulepreload" href="js/common.js">
  <link rel="modulepreload" href="js/schedule-core.js">
  <link rel="modulepreload" href="js/schedule.js">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="icon" href="assets/logo.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="boot" class="center-msg">جاري التحميل...</div>

  <div id="app" class="page hidden">
    <div class="topbar">
      <a class="brand" href="dashboard.html" style="color:inherit"><img class="logo" src="assets/logo.png" alt=""><span>بوابة أدوات Odoo</span></a>
      <div class="sp"></div>
      <a class="btn ghost sm icon" href="dashboard.html" title="الرجوع للوحة"><i class="fa-solid fa-house"></i></a>
      <button class="btn ghost sm icon" id="btnTheme" type="button"></button>
      <div class="profile" id="profile">
        <button class="pf-btn" id="pfBtn" type="button"><span class="pf-txt"><b id="whoName"></b><small id="whoRole"></small></span><span class="av" id="pfAv"></span></button>
        <div class="pf-menu hidden" id="pfMenu">
          <button type="button" id="pfSettings"><i class="fa-solid fa-gear"></i> الإعدادات</button>
          <button type="button" class="red" id="btnOut"><i class="fa-solid fa-right-from-bracket"></i> تسجيل الخروج</button>
        </div>
      </div>
    </div>
    <div class="container grow" style="width:100%">
      <div id="root"></div>
    </div>
  </div>
  <script type="module" src="js/schedule.js"></script>
</body>
</html>
