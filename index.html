<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول | بوابة أدوات Odoo</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-head">
        <i class="fa-solid fa-layer-group"></i>
        <h1>بوابة أدوات Odoo</h1>
        <p>أدوات الأتمتة المتقدمة لمعالجة وتنسيق الشيتات</p>
      </div>
      <div class="auth-body">
        <div id="notice" class="msg info hidden"></div>
        <div id="error" class="msg err hidden"></div>
        <form id="form" autocomplete="on">
          <div class="login-box">
            <div class="field">
              <label for="empId">الرقم الوظيفي</label>
              <div class="input-ico"><i class="fa-solid fa-id-badge"></i>
                <input id="empId" name="username" type="text" dir="ltr" inputmode="text" autocomplete="username" required autofocus></div>
            </div>
            <div class="field" style="margin-bottom:0">
              <label for="pass">كلمة المرور</label>
              <div class="input-ico"><i class="fa-solid fa-lock"></i>
                <input id="pass" name="password" type="password" dir="ltr" autocomplete="current-password" required></div>
            </div>
          </div>
          <button id="btn" class="btn-main" type="submit"><i class="fa-solid fa-right-to-bracket"></i> تسجيل الدخول</button>
        </form>
        <div class="foot">لو نسيت كلمة المرور كلّم مسؤول النظام.</div>
      </div>
    </div>
  <div class="credit"><a href="https://wa.me/201094264206" target="_blank" rel="noopener"><i class="fa-brands fa-whatsapp"></i> © 2026 تم الإنشاء بواسطة | محمد عمرو ابراهيم</a></div>
  </div>
  <script type="module" src="js/login.js"></script>
</body>
</html>
