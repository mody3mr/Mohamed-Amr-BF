<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الإعداد الأول | بوابة أدوات Odoo</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-head">
        <i class="fa-solid fa-user-shield"></i>
        <h1>الإعداد الأول</h1>
        <p>إنشاء حساب الأدمن (مرة واحدة فقط)</p>
      </div>
      <div class="auth-body">
        <div id="locked" class="hidden">
          <div class="msg okm">الإعداد اتعمل قبل كده، والصفحة دي اتقفلت.</div>
          <a class="btn block" href="index.html">الذهاب لتسجيل الدخول</a>
        </div>
        <div id="error" class="msg err hidden"></div>
        <form id="form" class="hidden">
          <div class="field"><label>الاسم</label><input id="name" required></div>
          <div class="field"><label>الرقم الوظيفي</label><input id="empId" dir="ltr" required><small>حروف إنجليزي أو أرقام فقط (2 إلى 32).</small></div>
          <div class="field"><label>كلمة المرور</label><input id="pass" type="password" dir="ltr" minlength="6" required></div>
          <div class="field"><label>تأكيد كلمة المرور</label><input id="pass2" type="password" dir="ltr" minlength="6" required></div>
          <button id="btn" class="btn block" type="submit"><i class="fa-solid fa-check"></i> إنشاء الأدمن</button>
        </form>
        <div id="loading" class="center-msg" style="min-height:120px">جاري التحقق...</div>
      </div>
    </div>
  </div>
  <script type="module" src="js/setup.js"></script>
</body>
</html>
